name: Sync Discovered MCP Catalog

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync discovered MCP catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-discovered-mcps.mjs --out src-tauri/resources/discovered_catalog.json --min-entries 10

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/resources/discovered_catalog.json
          git diff --staged --quiet || git commit -m "chore: sync discovered MCP catalog"
          git push
